<div class="ap-desafio-config" style="font-family:sans-serif;max-width:720px">
  <style>
    .ap-desafio-config label { display:block; margin-top:10px; font-weight:600; }
    .ap-desafio-config input, .ap-desafio-config textarea, .ap-desafio-config select { width:100%; box-sizing:border-box; padding:6px; font:inherit; }
    .ap-desafio-config textarea { min-height:70px; font-family:monospace; }
    .ap-desafio-config small { color:#555; font-weight:normal; }
  </style>
  <h3>Desafio de Programação: configuração</h3>

  <label for="titulo">Título</label>
  <input id="titulo" name="titulo" type="text" value="Soma dos números pares">

  <label for="enunciado">Enunciado</label>
  <textarea id="enunciado" name="enunciado">Escreva a função somaPares(lista) que recebe uma lista de inteiros e devolve a soma dos que são pares.</textarea>

  <label for="linguagem">Linguagem</label>
  <select id="linguagem" name="linguagem">
    <option value="javascript" selected>JavaScript</option>
    <option value="python">Python</option>
  </select>

  <label for="nome_funcao">Nome da função a implementar</label>
  <input id="nome_funcao" name="nome_funcao" type="text" value="somaPares">

  <label for="codigo_inicial">Código inicial</label>
  <textarea id="codigo_inicial" name="codigo_inicial">function somaPares(lista) {
  // escreva aqui o seu código
}</textarea>

  <label for="testes_publicos">Testes públicos <small>(JSON: descricao, argumentos, esperado)</small></label>
  <textarea id="testes_publicos" name="testes_publicos">[{"descricao": "lista mista", "argumentos": [[1, 2, 3, 4]], "esperado": 6}, {"descricao": "lista vazia", "argumentos": [[]], "esperado": 0}]</textarea>

  <label for="testes_ocultos">Testes ocultos <small>(JSON, não mostrados ao aluno)</small></label>
  <textarea id="testes_ocultos" name="testes_ocultos">[{"descricao": "só ímpares", "argumentos": [[1, 3, 5]], "esperado": 0}, {"descricao": "com negativos", "argumentos": [[-2, -3, 4]], "esperado": 2}]</textarea>

  <label for="dicas">Dicas <small>(lista JSON, por ordem)</small></label>
  <textarea id="dicas" name="dicas">["Use o operador % para saber se um número é par.", "Comece com um acumulador a 0 e percorra a lista com um ciclo."]</textarea>

  <label for="penalizacao_dica">Penalização por dica (%)</label>
  <input id="penalizacao_dica" name="penalizacao_dica" type="number" min="0" max="100" value="10">

  <label for="max_submissoes">Máximo de submissões</label>
  <input id="max_submissoes" name="max_submissoes" type="number" min="1" value="5">

  <label for="tempo_limite_min">Tempo-limite (minutos)</label>
  <input id="tempo_limite_min" name="tempo_limite_min" type="number" min="1" value="45">

  <label for="limiar_conclusao">Limiar de conclusão (% de testes ocultos)</label>
  <input id="limiar_conclusao" name="limiar_conclusao" type="number" min="0" max="100" value="100">
</div>
